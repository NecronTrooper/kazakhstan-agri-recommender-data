name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests before publishing
        run: pytest

      - name: Build release archive (code, datasets, dictionaries)
        run: |
          zip -r "dataset-${GITHUB_REF_NAME}.zip" \
            *.py output/*.csv figures requirements.txt \
            README.md LICENSE DATA_LICENSE.md CITATION.cff \
            Словарь_данных_*.md Отчёт_о_сборе_данных.md \
            -x "output/*_cache/*"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dataset-*.zip
          generate_release_notes: true
